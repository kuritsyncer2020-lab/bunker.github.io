<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Бункер – колода карт</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: #0d0d1a;
            color: #e0e0e0;
            padding: 20px;
            min-height: 100vh;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 {
            text-align: center;
            font-size: 2.5rem;
            color: #f5c842;
            margin-bottom: 10px;
            letter-spacing: 2px;
            text-shadow: 0 0 10px #f5c84255;
        }
        .btn-primary, .btn-secondary, .btn-print, .btn-success, .btn-secret-print {
            border: none;
            font-weight: bold;
            padding: 14px 28px;
            border-radius: 50px;
            cursor: pointer;
            transition: 0.2s;
            font-size: 1.1rem;
            display: inline-block;
            margin: 5px 8px 20px 0;
        }
        .btn-primary {
            background: #f5c842;
            color: #1a1a2e;
            box-shadow: 0 4px 15px #f5c84255;
        }
        .btn-primary:hover { background: #ffd95e; transform: scale(1.02); }
        .btn-success {
            background: #2ecc71;
            color: #1a1a2e;
            box-shadow: 0 4px 15px #2ecc7155;
        }
        .btn-success:hover { background: #27ae60; transform: scale(1.02); }
        .btn-secondary {
            background: #2d2d4a;
            color: #e0e0e0;
            box-shadow: 0 4px 15px #00000055;
        }
        .btn-secondary:hover { background: #3d3d5e; }
        .btn-print {
            background: #74b9ff;
            color: #1a1a2e;
            box-shadow: 0 4px 15px #74b9ff55;
        }
        .btn-print:hover { background: #8fcbff; transform: scale(1.02); }
        .btn-secret-print {
            background: #a29bfe;
            color: #1a1a2e;
            box-shadow: 0 4px 15px #a29bfe55;
        }
        .btn-secret-print:hover { background: #b8b0ff; transform: scale(1.02); }
        .create-panel {
            background: #1a1a2e;
            border-radius: 12px;
            padding: 15px 20px;
            margin: 10px 0 20px 0;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 15px;
            border: 1px solid #2a2a44;
        }
        .create-panel label {
            color: #aaa;
            font-weight: 600;
        }
        .create-panel input[type="number"] {
            width: 80px;
            padding: 10px 12px;
            border: none;
            border-radius: 8px;
            background: #2d2d4a;
            color: #fff;
            font-size: 1.1rem;
            text-align: center;
            outline: none;
        }
        .create-panel input[type="number"]:focus {
            box-shadow: 0 0 0 2px #f5c84255;
        }
        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .control-group {
            background: #1a1a2e;
            border-radius: 12px;
            padding: 15px;
            border: 1px solid #2a2a44;
        }
        .control-group h3 {
            color: #f5c842;
            margin-bottom: 10px;
            font-size: 1.1rem;
            border-bottom: 1px solid #2a2a44;
            padding-bottom: 5px;
        }
        .control-group ul {
            list-style: none;
            max-height: 180px;
            overflow-y: auto;
            margin: 10px 0;
        }
        .control-group ul li {
            background: #252540;
            padding: 6px 10px;
            margin: 4px 0;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
        }
        .control-group ul li .item-text {
            flex: 1;
            margin-right: 8px;
        }
        .control-group .add-area {
            display: flex;
            gap: 6px;
            margin-top: 8px;
            flex-wrap: wrap;
        }
        .control-group input {
            flex: 1;
            padding: 8px;
            border: none;
            border-radius: 6px;
            background: #2d2d4a;
            color: #fff;
            outline: none;
            font-family: inherit;
            min-width: 100px;
        }
        .control-group input::placeholder { color: #888; }
        .control-group .add-btn {
            background: #2ecc71;
            border: none;
            color: #1a1a2e;
            font-weight: bold;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
        }
        .control-group .add-btn:hover { background: #27ae60; }
        .btn-danger {
            background: #e74c3c;
            color: #fff;
            border: none;
            padding: 2px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
        }
        .btn-danger:hover { background: #c0392b; }
        .secret-control-group .secret-item {
            display: flex;
            flex-direction: column;
            background: #252540;
            padding: 8px 10px;
            margin: 6px 0;
            border-radius: 6px;
        }
        .secret-item .secret-title {
            font-weight: bold;
            color: #a29bfe;
        }
        .secret-item .secret-desc {
            font-size: 0.85rem;
            color: #aaa;
            margin: 2px 0;
        }
        .secret-item .secret-effect {
            font-size: 0.85rem;
            color: #f5c842;
        }
        .secret-item .secret-actions {
            display: flex;
            justify-content: flex-end;
            margin-top: 4px;
        }
        .footer {
            text-align: center;
            margin-top: 40px;
            color: #666;
            font-size: 0.9rem;
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #f5c84255; border-radius: 10px; }
        ::-webkit-scrollbar-track { background: #1a1a2e; }
        @media (max-width: 600px) {
            .create-panel { flex-direction: column; align-items: stretch; }
            .create-panel input[type="number"] { width: 100%; }
        }
        @media print {
            .controls, .create-panel, .btn-primary, .btn-secondary, .btn-print, .btn-success,
            .btn-secret-print, .footer { display: none !important; }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>🃏 КОЛОДА КАРТ «БУНКЕР»</h1>

    <div class="create-panel">
        <label for="cardCountInput">Количество карт каждого типа:</label>
        <input type="number" id="cardCountInput" value="6" min="1" max="20">
        <button class="btn-success" id="generateDeckBtn">🃏 Сгенерировать колоду</button>
        <button class="btn-print" id="printDeckBtn">🖨️ Распечатать колоду</button>
        <button class="btn-secret-print" id="printSecretsBtn">🔮 Распечатать секреты</button>
        <button class="btn-secondary" id="resetBtn">♻️ Сбросить</button>
    </div>

    <h2 style="color: #f5c842; margin: 20px 0 10px; font-weight: 300;">Редактировать списки</h2>
    <div class="controls" id="controlsContainer"></div>

    <h2 style="color: #a29bfe; margin: 30px 0 10px; font-weight: 300;">Секретные карточки</h2>
    <div class="controls" id="secretControlsContainer"></div>

    <div class="footer">Все изменения сохраняются. Нажмите «Сгенерировать колоду» для создания набора карт.</div>
</div>

<script>
    (function() {
        // ===== ДАННЫЕ =====
        const DEFAULT_DATA = {
            gender: ['Мужской', 'Женский'],
            health: ['Отличное', 'Среднее', 'Слабое', 'Хронические болезни', 'Крепкое', 'Ранен'],
            age: [20, 22, 25, 28, 30, 33, 35, 38, 40, 42, 45, 48, 50, 55, 60],
            jobs: ['Инженер', 'Врач', 'Учитель', 'Строитель', 'Повар', 'Водитель', 'Программист', 'Фермер', 'Военный', 'Пожарный', 'Медсестра'],
            hobbies: ['Чтение', 'Рыбалка', 'Охота', 'Гитара', 'Шахматы', 'Бег', 'Фотография', 'Рисование', 'Садоводство', 'Кулинария'],
            items: ['Аптечка', 'Фонарик', 'Нож', 'Верёвка', 'Консервы', 'Компас', 'Рация', 'Топор', 'Спички', 'Палатка'],
            facts: ['умеет долго стоять на одной ноге', 'за 5 минут съедает суп вилкой', 'жонглирует петардами',
                    'знаком через 30 рукопожатий с Клинтоном', 'может отличить 50 оттенков серого',
                    'никогда не проигрывает в камень-ножницы-бумага', 'умеет говорить голосом Дарта Вейдера',
                    'знает наизусть все серии "Друзей"', 'может завязать шнурки одной рукой',
                    'всегда знает, который час без часов'],
            orientations: ['Гетеросексуал', 'Гомосексуал', 'Бисексуал', 'Асексуал', 'Чайлд-фри', 'Бесплодие',
                          'Любит мальчиков', 'Любит девочек', 'Полиамор', 'Не определился'],
            skills: ['умеет дышать под водой, но с аквалангом', 'умеет читать книгу задом наперед, но ничего не понимает',
                    'записывает треки, но всегда с выключенным микрофоном', 'может заварить чай без чайника, используя утюг',
                    'умеет свистеть, но только в помещении', 'всегда находит потерянные вещи, но через неделю',
                    'может проспать 24 часа, но потом не спит двое суток', 'умеет разговаривать с животными, но они его не слушают'],
            education: [
                'Закончил ПТУ с отличием', 'Не закончил 9 классов', 'Инженер-электроник',
                'Химик-лаборант', 'Высшее образование (МГУ)', 'Среднее специальное',
                'Самоучка', 'Доктор наук', 'Кандидат наук', 'Техник-программист',
                'Строитель-монтажник', 'Водитель-механик', 'Медицинская сестра',
                'Военное училище', 'Курсы повышения квалификации'
            ],
            phobias: [
                'Арахнофобия', 'Клаустрофобия', 'Боязнь высоты', 'Акрофобия',
                'Социофобия', 'Агорафобия', 'Никтофобия', 'Герпетофобия',
                'Кинофобия', 'Аэрофобия', 'Танатофобия', 'Астрапофобия',
                'Мурофобия', 'Зоофобия', 'Аутофобия', 'Дентофобия',
                'Гемофобия', 'Трипофобия', 'Номофобия', 'Ксенофобия'
            ]
        };

        const DEFAULT_SECRETS = [
            { title: 'Неприкасаемый', description: 'Этого игрока нельзя выгнать из бункера в этом раунде.', effect: 'Защита от выгона' },
            { title: 'Медицинский гений', description: 'Если у вас есть аптечка, вы можете вылечить одного раненого.', effect: 'Лечение' },
            { title: 'Параноик', description: 'Вы не доверяете никому. Все голоса против вас считаются двойными.', effect: 'Двойной голос против' },
            { title: 'Лидер', description: 'Ваш голос при решении о выгоне считается за два.', effect: 'Двойной голос за' },
            { title: 'Шпион', description: 'Вы знаете одну тайну о другом игроке (выберите сами).', effect: 'Информация' }
        ];

        const STORAGE_KEY = 'bunkerDeckData';

        function getDefault() {
            return {
                ...JSON.parse(JSON.stringify(DEFAULT_DATA)),
                secrets: JSON.parse(JSON.stringify(DEFAULT_SECRETS))
            };
        }

        function loadData() {
            const stored = localStorage.getItem(STORAGE_KEY);
            if (stored) {
                try {
                    const parsed = JSON.parse(stored);
                    for (let key in DEFAULT_DATA) {
                        if (!parsed[key] || !Array.isArray(parsed[key])) {
                            parsed[key] = [...DEFAULT_DATA[key]];
                        }
                    }
                    if (!parsed.secrets || !Array.isArray(parsed.secrets) || parsed.secrets.length === 0) {
                        parsed.secrets = JSON.parse(JSON.stringify(DEFAULT_SECRETS));
                    }
                    return parsed;
                } catch (e) {
                    return getDefault();
                }
            } else {
                return getDefault();
            }
        }

        let data = loadData();

        function saveData() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        }

        function getRandom(arr) {
            return arr[Math.floor(Math.random() * arr.length)];
        }

        function shuffleArray(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function getUniqueRandomValues(arr, n) {
            const shuffled = shuffleArray([...arr]);
            if (shuffled.length >= n) {
                return shuffled.slice(0, n);
            } else {
                const result = [...shuffled];
                while (result.length < n) {
                    result.push(getRandom(arr));
                }
                return result;
            }
        }

        function generateExperience() {
            const months = Math.floor(Math.random() * 360) + 1;
            if (months < 12) {
                return months + ' ' + (months === 1 ? 'месяц' : months >= 2 && months <= 4 ? 'месяца' : 'месяцев');
            } else {
                const years = Math.floor(months / 12);
                return years + ' ' + (years === 1 ? 'год' : years >= 2 && years <= 4 ? 'года' : 'лет');
            }
        }

        // КАТЕГОРИИ ДЛЯ КОЛОДЫ
        const CATEGORIES = [
            { key: 'gender', label: 'Пол', icon: '⚤', cls: 'gender' },
            { key: 'health', label: 'Здоровье', icon: '❤️', cls: 'health' },
            { key: 'age', label: 'Возраст', icon: '🎂', cls: 'age' },
            { key: 'jobs', label: 'Работа', icon: '💼', cls: 'job' },
            { key: 'hobbies', label: 'Хобби', icon: '🎨', cls: 'hobby' },
            { key: 'items', label: 'Предмет', icon: '🎒', cls: 'items' },
            { key: 'facts', label: 'Факт', icon: '🧩', cls: 'fact' },
            { key: 'orientations', label: 'Ориентация', icon: '❤️', cls: 'orientation' },
            { key: 'skills', label: 'Навык', icon: '⚡', cls: 'skill' },
            { key: 'education', label: 'Образование', icon: '🎓', cls: 'education' },
            { key: 'phobias', label: 'Фобия', icon: '😱', cls: 'phobia' }
        ];

        // ГЕНЕРАЦИЯ КОЛОДЫ
        let deck = {};

        function generateDeck(count) {
            deck = {};
            CATEGORIES.forEach(cat => {
                const values = data[cat.key] || [];
                deck[cat.key] = getUniqueRandomValues(values, count);
            });
        }

        // ПЕЧАТЬ КОЛОДЫ
        function printDeck() {
            const count = parseInt(document.getElementById('cardCountInput').value) || 6;
            generateDeck(count);

            let html = `
            <!DOCTYPE html>
            <html>
            <head><meta charset="UTF-8"><title>Колода карт Бункер</title>
            <style>
                * { margin:0; padding:0; box-sizing:border-box; }
                body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #fff; padding: 20px; }
                .deck-container { max-width: 1200px; margin: 0 auto; }
                h1 { text-align: center; font-size: 2.5rem; color: #1a1a2e; margin-bottom: 30px; border-bottom: 3px solid #f5c842; padding-bottom: 10px; }
                .category-section { margin: 30px 0; }
                .category-title { font-size: 1.8rem; font-weight: bold; color: #2d2d4a; margin-bottom: 15px; border-left: 4px solid #f5c842; padding-left: 15px; }
                .cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; }
                .card {
                    background: #f9f9ff;
                    border: 2px solid #333;
                    border-radius: 12px;
                    padding: 20px 15px;
                    text-align: center;
                    min-height: 120px;
                    display: flex;
                    flex-direction: column;
                    justify-content: center;
                    align-items: center;
                    page-break-inside: avoid;
                    break-inside: avoid;
                }
                .card .icon { font-size: 2.5rem; margin-bottom: 8px; }
                .card .label { font-size: 0.9rem; color: #888; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
                .card .value { font-size: 1.4rem; font-weight: 700; color: #000; margin-top: 4px; }
                .card .value.health { color: #c0392b; }
                .card .value.age { color: #2980b9; }
                .card .value.job { color: #d4a017; }
                .card .value.hobby { color: #6c5b7b; }
                .card .value.items { color: #16a085; }
                .card .value.fact { color: #8e44ad; }
                .card .value.orientation { color: #d4a017; }
                .card .value.skill { color: #c0392b; }
                .card .value.education { color: #1abc9c; }
                .card .value.phobia { color: #8e44ad; }
                .card .value.gender.male { color: #2980b9; }
                .card .value.gender.female { color: #c0392b; }
                .card .value.gender { color: #2d2d4a; }
                @media print {
                    body { padding: 0.3in; }
                    .card { border: 1px solid #333; }
                }
            </style>
            </head>
            <body>
                <div class="deck-container">
                    <h1>🃏 КОЛОДА КАРТ «БУНКЕР»</h1>
            `;

            CATEGORIES.forEach(cat => {
                const cards = deck[cat.key] || [];
                if (cards.length === 0) return;
                html += `
                    <div class="category-section">
                        <div class="category-title">${cat.icon} ${cat.label}</div>
                        <div class="cards-grid">
                `;
                cards.forEach(value => {
                    let valueClass = cat.cls;
                    if (cat.key === 'gender') {
                        valueClass += ' ' + (value === 'Мужской' ? 'male' : 'female');
                    }
                    html += `
                        <div class="card">
                            <div class="icon">${cat.icon}</div>
                            <div class="label">${cat.label}</div>
                            <div class="value ${valueClass}">${value}</div>
                        </div>
                    `;
                });
                html += `
                        </div>
                    </div>
                `;
            });

            html += `
                </div>
                <script>
                    window.onload = function() { window.print(); }
                <\/script>
            </body>
            </html>
            `;

            const win = window.open('', '_blank');
            if (win) {
                win.document.write(html);
                win.document.close();
            } else {
                alert('Разрешите всплывающие окна для печати.');
            }
        }

        // ПЕЧАТЬ СЕКРЕТОВ (отдельно)
        function printSecrets() {
            if (!data.secrets || data.secrets.length === 0) {
                alert('Список секретов пуст. Добавьте секреты в настройках.');
                return;
            }
            let html = `
            <!DOCTYPE html>
            <html>
            <head><meta charset="UTF-8"><title>Секретные карточки</title>
            <style>
                * { margin:0; padding:0; box-sizing:border-box; }
                body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #fff; padding: 40px; max-width: 800px; margin: 0 auto; }
                h1 { color: #1a1a2e; border-bottom: 2px solid #a29bfe; text-align:center; margin-bottom:30px; font-size: 2.5rem; }
                .secret-card {
                    border: 2px solid #6c5b7b;
                    border-radius: 16px;
                    padding: 25px 30px;
                    margin: 16px 0;
                    background: #f9f9ff;
                    page-break-inside: avoid;
                    break-inside: avoid;
                }
                .secret-card .title { font-size: 1.8rem; font-weight: bold; color: #2d2d4a; }
                .secret-card .effect { color: #e67e22; font-size: 1.1rem; margin-top: 6px; }
                .secret-card .desc { color: #555; margin-top: 8px; font-size: 1.05rem; }
                .secret-card .number { color: #999; font-size: 0.9rem; margin-bottom: 4px; }
                @media print { body { padding: 0.5in; } }
            </style>
            </head>
            <body>
                <h1>🔮 Секретные карточки</h1>
            `;

            data.secrets.forEach((secret, idx) => {
                html += `
                    <div class="secret-card">
                        <div class="number">Карточка #${idx+1}</div>
                        <div class="title">${secret.title}</div>
                        <div class="effect">🎯 ${secret.effect}</div>
                        <div class="desc">${secret.description}</div>
                    </div>
                `;
            });

            html += `
                <script>
                    window.onload = function() { window.print(); }
                <\/script>
            </body>
            </html>
            `;

            const win = window.open('', '_blank');
            if (win) {
                win.document.write(html);
                win.document.close();
            } else {
                alert('Разрешите всплывающие окна для печати.');
            }
        }

        // ===== ОТРИСОВКА УПРАВЛЕНИЯ =====
        function renderControls() {
            const container = document.getElementById('controlsContainer');
            container.innerHTML = '';

            const categories = [
                { key: 'gender', label: 'Пол', placeholder: 'Напр. Мужской' },
                { key: 'health', label: 'Здоровье', placeholder: 'Напр. Отличное' },
                { key: 'age', label: 'Возраст', placeholder: 'Напр. 22' },
                { key: 'jobs', label: 'Работа', placeholder: 'Напр. Плотник' },
                { key: 'hobbies', label: 'Хобби', placeholder: 'Напр. Плавание' },
                { key: 'items', label: 'Предметы', placeholder: 'Напр. Палатка' },
                { key: 'facts', label: 'Интересные факты', placeholder: 'Напр. умеет жонглировать' },
                { key: 'orientations', label: 'Ориентации', placeholder: 'Напр. Бисексуал' },
                { key: 'skills', label: 'Специальные навыки', placeholder: 'Напр. умеет дышать под водой' },
                { key: 'education', label: 'Образование', placeholder: 'Напр. Инженер-электроник' },
                { key: 'phobias', label: 'Фобии', placeholder: 'Напр. Арахнофобия' }
            ];

            categories.forEach(cat => {
                const group = document.createElement('div');
                group.className = 'control-group';

                const title = document.createElement('h3');
                title.textContent = cat.label;
                group.appendChild(title);

                const list = document.createElement('ul');
                list.id = `list-${cat.key}`;

                const items = data[cat.key];
                items.forEach((value, index) => {
                    const li = document.createElement('li');
                    const span = document.createElement('span');
                    span.className = 'item-text';
                    span.textContent = value;
                    li.appendChild(span);
                    const delBtn = document.createElement('button');
                    delBtn.className = 'btn-danger';
                    delBtn.textContent = '✕';
                    delBtn.addEventListener('click', () => {
                        data[cat.key].splice(index, 1);
                        saveData();
                        renderControls();
                    });
                    li.appendChild(delBtn);
                    list.appendChild(li);
                });

                group.appendChild(list);

                const addArea = document.createElement('div');
                addArea.className = 'add-area';
                const input = document.createElement('input');
                input.type = 'text';
                input.placeholder = cat.placeholder;
                input.id = `input-${cat.key}`;
                const addBtn = document.createElement('button');
                addBtn.className = 'add-btn';
                addBtn.textContent = '+ Добавить';
                addBtn.addEventListener('click', () => {
                    const val = input.value.trim();
                    if (val === '') return;
                    data[cat.key].push(val);
                    saveData();
                    renderControls();
                    input.value = '';
                });
                input.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') addBtn.click();
                });

                addArea.appendChild(input);
                addArea.appendChild(addBtn);
                group.appendChild(addArea);

                container.appendChild(group);
            });

            renderSecretControls();
        }

        function renderSecretControls() {
            const container = document.getElementById('secretControlsContainer');
            container.innerHTML = '';

            const group = document.createElement('div');
            group.className = 'control-group secret-control-group';
            group.style.gridColumn = '1 / -1';

            const title = document.createElement('h3');
            title.textContent = 'Список секретных карточек';
            group.appendChild(title);

            const list = document.createElement('ul');
            data.secrets.forEach((secret, index) => {
                const li = document.createElement('li');
                li.className = 'secret-item';
                const titleDiv = document.createElement('div');
                titleDiv.className = 'secret-title';
                titleDiv.textContent = secret.title || 'Без названия';
                const descDiv = document.createElement('div');
                descDiv.className = 'secret-desc';
                descDiv.textContent = secret.description || '';
                const effectDiv = document.createElement('div');
                effectDiv.className = 'secret-effect';
                effectDiv.textContent = 'Эффект: ' + (secret.effect || '—');
                const actions = document.createElement('div');
                actions.className = 'secret-actions';
                const delBtn = document.createElement('button');
                delBtn.className = 'btn-danger';
                delBtn.textContent = 'Удалить';
                delBtn.addEventListener('click', () => {
                    data.secrets.splice(index, 1);
                    saveData();
                    renderSecretControls();
                });
                actions.appendChild(delBtn);
                li.appendChild(titleDiv);
                li.appendChild(descDiv);
                li.appendChild(effectDiv);
                li.appendChild(actions);
                list.appendChild(li);
            });

            group.appendChild(list);

            const addArea = document.createElement('div');
            addArea.className = 'add-area';
            addArea.style.flexWrap = 'wrap';
            const inputTitle = document.createElement('input');
            inputTitle.type = 'text';
            inputTitle.placeholder = 'Название';
            inputTitle.style.flexBasis = '100%';
            const inputDesc = document.createElement('textarea');
            inputDesc.placeholder = 'Описание';
            inputDesc.style.flexBasis = '100%';
            const inputEffect = document.createElement('input');
            inputEffect.type = 'text';
            inputEffect.placeholder = 'Эффект (кратко)';
            inputEffect.style.flexBasis = '60%';
            const addBtn = document.createElement('button');
            addBtn.className = 'add-btn';
            addBtn.textContent = '+ Добавить секретную карточку';
            addBtn.addEventListener('click', () => {
                const title = inputTitle.value.trim();
                const desc = inputDesc.value.trim();
                const effect = inputEffect.value.trim();
                if (!title) { alert('Введите название'); return; }
                data.secrets.push({ title, description: desc, effect: effect || '—' });
                saveData();
                renderSecretControls();
                inputTitle.value = '';
                inputDesc.value = '';
                inputEffect.value = '';
            });

            addArea.appendChild(inputTitle);
            addArea.appendChild(inputDesc);
            addArea.appendChild(inputEffect);
            addArea.appendChild(addBtn);
            group.appendChild(addArea);

            container.appendChild(group);
        }

        // ===== СОБЫТИЯ =====
        document.getElementById('printDeckBtn').addEventListener('click', printDeck);
        document.getElementById('printSecretsBtn').addEventListener('click', printSecrets);

        document.getElementById('generateDeckBtn').addEventListener('click', function() {
            const count = parseInt(document.getElementById('cardCountInput').value) || 6;
            generateDeck(count);
            alert(`Колода сгенерирована! ${count} карт каждого типа. Нажмите «Распечатать колоду».`);
        });

        document.getElementById('resetBtn').addEventListener('click', function() {
            if (confirm('Сбросить все списки к стандартным?')) {
                localStorage.removeItem(STORAGE_KEY);
                data = getDefault();
                saveData();
                renderControls();
            }
        });

        // ===== ЗАПУСК =====
        renderControls();
        // Сразу генерируем колоду
        generateDeck(6);
    })();
</script>
</body>
</html>
