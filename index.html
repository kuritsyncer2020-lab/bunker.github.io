<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Бункер – Колода карт + История</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Roboto:wght@400;700&display=swap" rel="stylesheet" />
    <style>
        /* ===== ГЛОБАЛЬНЫЕ СТИЛИ ===== */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Roboto', sans-serif;
            background: #1a1410;
            color: #e0d6c8;
            min-height: 100vh;
            transition: background 0.5s;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><rect width="100" height="100" fill="%232b211a"/><path d="M10 10 L90 10 L90 90 L10 90 Z" stroke="%233d2e24" stroke-width="1" fill="none"/><circle cx="20" cy="20" r="2" fill="%234d3c30"/><circle cx="80" cy="80" r="3" fill="%234d3c30"/><circle cx="50" cy="50" r="1.5" fill="%235a4638"/></svg>');
            background-size: 200px 200px;
            position: relative;
        }
        /* Загруженный фон */
        body.custom-bg {
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(20, 15, 10, 0.7);
            z-index: -1;
            pointer-events: none;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            z-index: 1;
        }
        /* ===== ЗАСТАВКА ===== */
        #splashScreen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #1a1410;
            z-index: 9999;
            transition: opacity 1s, visibility 1s;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><rect width="100" height="100" fill="%231a1410"/><path d="M0 0 L100 0 L100 100 L0 100 Z" stroke="%233d2e24" stroke-width="2" fill="none"/><circle cx="50" cy="50" r="40" stroke="%235a4638" stroke-width="1" fill="none"/></svg>');
            background-size: 300px 300px;
        }
        #splashScreen.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        .splash-bg {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-size: cover;
            background-position: center;
            opacity: 0.4;
            z-index: 0;
        }
        .splash-content {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 20px;
        }
        .splash-title {
            font-family: 'Russo One', sans-serif;
            font-size: 6rem;
            color: #f5c842;
            text-shadow: 0 0 20px #f5c84255, 0 0 60px #f5c84233, 0 4px 0 #8a6d1b, 0 8px 0 #5a4510;
            letter-spacing: 8px;
            margin-bottom: 20px;
            position: relative;
            display: inline-block;
            transform: rotate(-1deg);
            /* Эффект разрушения */
            filter: url(#distortion);
        }
        .splash-title::before,
        .splash-title::after {
            content: 'БУНКЕР';
            position: absolute;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            color: #f5c842;
            opacity: 0.2;
            z-index: -1;
        }
        .splash-title::before {
            transform: translate(4px, 4px) scale(1.02);
            filter: blur(2px);
        }
        .splash-title::after {
            transform: translate(-4px, -4px) scale(0.98);
            filter: blur(1px);
        }
        .splash-sub {
            font-family: 'Russo One', sans-serif;
            font-size: 1.5rem;
            color: #b8a088;
            letter-spacing: 12px;
            text-transform: uppercase;
            margin-bottom: 40px;
            opacity: 0.8;
        }
        .btn-start {
            font-family: 'Russo One', sans-serif;
            background: transparent;
            border: 3px solid #f5c842;
            color: #f5c842;
            padding: 18px 50px;
            font-size: 2rem;
            cursor: pointer;
            border-radius: 8px;
            letter-spacing: 4px;
            transition: 0.3s;
            position: relative;
            overflow: hidden;
            text-shadow: 0 0 10px #f5c84255;
        }
        .btn-start:hover {
            background: #f5c842;
            color: #1a1410;
            box-shadow: 0 0 30px #f5c84288;
            transform: scale(1.05);
        }
        .btn-start::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(245,200,66,0.2) 0%, transparent 60%);
            opacity: 0;
            transition: 0.5s;
        }
        .btn-start:hover::after {
            opacity: 1;
        }
        @media (max-width: 600px) {
            .splash-title { font-size: 3.5rem; letter-spacing: 4px; }
            .splash-sub { font-size: 1rem; letter-spacing: 6px; }
            .btn-start { font-size: 1.5rem; padding: 14px 30px; }
        }

        /* ===== ОСНОВНОЙ ИНТЕРФЕЙС ===== */
        .main-interface {
            display: none;
        }
        .main-interface.active {
            display: block;
        }
        h1 {
            font-family: 'Russo One', sans-serif;
            text-align: center;
            font-size: 3rem;
            color: #f5c842;
            margin-bottom: 10px;
            letter-spacing: 4px;
            text-shadow: 0 0 20px #f5c84255;
            border-bottom: 2px solid #f5c84244;
            padding-bottom: 10px;
        }
        .panel {
            background: rgba(30, 24, 20, 0.9);
            border-radius: 12px;
            padding: 15px 20px;
            margin: 10px 0 20px 0;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 15px;
            border: 1px solid #4a3a2e;
            backdrop-filter: blur(4px);
        }
        .panel label {
            color: #b8a088;
            font-weight: 600;
        }
        .panel input[type="number"] {
            width: 80px;
            padding: 10px 12px;
            border: none;
            border-radius: 6px;
            background: #2d221c;
            color: #e0d6c8;
            font-size: 1.1rem;
            text-align: center;
            outline: none;
            border: 1px solid #4a3a2e;
        }
        .panel input[type="number"]:focus {
            border-color: #f5c842;
            box-shadow: 0 0 10px #f5c84233;
        }

        /* КНОПКИ СТИЛЬ "ТЕХНО/БУНКЕР" */
        .btn {
            border: none;
            font-weight: bold;
            padding: 12px 28px;
            border-radius: 50px;
            cursor: pointer;
            transition: 0.3s;
            font-size: 1rem;
            display: inline-block;
            margin: 5px 8px 20px 0;
            font-family: 'Roboto', sans-serif;
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
            background: #3d2e24;
            color: #d4c5b5;
            box-shadow: 0 4px 0 #1f1610;
            border: 1px solid #5a4638;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 0 #1f1610, 0 0 20px #f5c84233;
            background: #4d3a2e;
            color: #f5c842;
        }
        .btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #1f1610;
        }
        .btn-primary {
            background: #f5c842;
            color: #1a1410;
            border-color: #f5c842;
            box-shadow: 0 4px 0 #b38f2a;
        }
        .btn-primary:hover {
            background: #ffd95e;
            color: #1a1410;
            box-shadow: 0 6px 0 #b38f2a, 0 0 30px #f5c84266;
        }
        .btn-success {
            background: #2e7d5e;
            color: #e0d6c8;
            border-color: #2e7d5e;
            box-shadow: 0 4px 0 #1a4a36;
        }
        .btn-success:hover {
            background: #3a9a72;
            box-shadow: 0 6px 0 #1a4a36, 0 0 30px #2ecc7155;
        }
        .btn-secondary {
            background: #2d221c;
            color: #b8a088;
            border-color: #4a3a2e;
            box-shadow: 0 4px 0 #1a1410;
        }
        .btn-secondary:hover {
            background: #3d2e24;
            color: #f5c842;
            box-shadow: 0 6px 0 #1a1410;
        }
        .btn-print {
            background: #3d5a7d;
            color: #e0d6c8;
            border-color: #3d5a7d;
            box-shadow: 0 4px 0 #1f334a;
        }
        .btn-print:hover {
            background: #4a6a94;
            box-shadow: 0 6px 0 #1f334a, 0 0 30px #74b9ff55;
        }
        .btn-secret-print {
            background: #5a3d6b;
            color: #e0d6c8;
            border-color: #5a3d6b;
            box-shadow: 0 4px 0 #362445;
        }
        .btn-secret-print:hover {
            background: #6d4a82;
            box-shadow: 0 6px 0 #362445, 0 0 30px #a29bfe55;
        }
        .btn-danger {
            background: #7d2e2e;
            color: #e0d6c8;
            border-color: #7d2e2e;
            box-shadow: 0 4px 0 #4a1a1a;
            padding: 4px 14px;
            font-size: 0.8rem;
        }
        .btn-danger:hover {
            background: #9a3a3a;
            box-shadow: 0 6px 0 #4a1a1a, 0 0 20px #e74c3c55;
        }
        .btn-sm {
            padding: 4px 14px;
            font-size: 0.8rem;
            margin: 2px 4px;
        }

        /* ===== КАРТОЧКИ КОЛОДЫ ===== */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin: 20px 0;
        }
        .card-item {
            background: #f2e6d9;
            border-radius: 16px;
            padding: 20px 15px;
            text-align: center;
            min-height: 150px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border: 2px solid #b8a088;
            box-shadow: 0 8px 0 #6a5a4a, 0 10px 30px rgba(0,0,0,0.6);
            transition: 0.3s;
            color: #1a1410;
            position: relative;
            background-image: linear-gradient(145deg, #f2e6d9 0%, #dccfc0 100%);
            cursor: default;
            animation: dealCard 0.5s ease-out forwards;
            opacity: 0;
            transform: translateY(30px) scale(0.95);
        }
        .card-item:nth-child(1) { animation-delay: 0.05s; }
        .card-item:nth-child(2) { animation-delay: 0.10s; }
        .card-item:nth-child(3) { animation-delay: 0.15s; }
        .card-item:nth-child(4) { animation-delay: 0.20s; }
        .card-item:nth-child(5) { animation-delay: 0.25s; }
        .card-item:nth-child(6) { animation-delay: 0.30s; }
        .card-item:nth-child(7) { animation-delay: 0.35s; }
        .card-item:nth-child(8) { animation-delay: 0.40s; }
        .card-item:nth-child(9) { animation-delay: 0.45s; }
        .card-item:nth-child(10) { animation-delay: 0.50s; }
        .card-item:nth-child(11) { animation-delay: 0.55s; }
        .card-item:nth-child(12) { animation-delay: 0.60s; }
        .card-item:nth-child(13) { animation-delay: 0.65s; }
        .card-item:nth-child(14) { animation-delay: 0.70s; }
        .card-item:nth-child(15) { animation-delay: 0.75s; }
        .card-item:nth-child(16) { animation-delay: 0.80s; }
        .card-item:nth-child(17) { animation-delay: 0.85s; }
        .card-item:nth-child(18) { animation-delay: 0.90s; }
        .card-item:nth-child(19) { animation-delay: 0.95s; }
        .card-item:nth-child(20) { animation-delay: 1.00s; }
        @keyframes dealCard {
            0% { opacity: 0; transform: translateY(30px) scale(0.95); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }
        .card-item:hover {
            transform: translateY(-10px) rotate(1deg);
            box-shadow: 0 12px 0 #6a5a4a, 0 20px 40px rgba(0,0,0,0.7);
        }
        .card-item .icon {
            font-size: 2.8rem;
            margin-bottom: 6px;
        }
        .card-item .label {
            font-size: 0.8rem;
            color: #5a4a3a;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .card-item .value {
            font-size: 1.4rem;
            font-weight: 700;
            margin-top: 4px;
            word-break: break-word;
        }
        .card-item .value.health { color: #b33a2a; }
        .card-item .value.age { color: #2a6a8a; }
        .card-item .value.experience { color: #8a7a2a; }
        .card-item .value.job { color: #8a6a1a; }
        .card-item .value.hobby { color: #5a3a7a; }
        .card-item .value.items { color: #1a7a5a; }
        .card-item .value.fact { color: #6a2a7a; }
        .card-item .value.orientation { color: #8a5a1a; }
        .card-item .value.skill { color: #b33a2a; }
        .card-item .value.education { color: #1a7a8a; }
        .card-item .value.phobia { color: #6a2a5a; }
        .card-item .value.gender.male { color: #2a5a8a; }
        .card-item .value.gender.female { color: #b33a6a; }

        /* ===== ИСТОРИИ ===== */
        .history-section {
            background: rgba(30, 24, 20, 0.9);
            border-radius: 12px;
            padding: 20px;
            margin: 20px 0;
            border: 1px solid #4a3a2e;
            backdrop-filter: blur(4px);
        }
        .history-section h2 {
            font-family: 'Russo One', sans-serif;
            color: #f5c842;
            margin-bottom: 15px;
            font-size: 1.8rem;
            letter-spacing: 2px;
        }
        .history-list {
            max-height: 400px;
            overflow-y: auto;
            padding-right: 10px;
        }
        .history-item {
            background: #2d221c;
            padding: 15px;
            margin: 10px 0;
            border-radius: 8px;
            border-left: 4px solid #f5c842;
            transition: 0.3s;
        }
        .history-item:hover {
            background: #3d2e24;
        }
        .history-item .history-title {
            font-family: 'Russo One', sans-serif;
            color: #f5c842;
            font-size: 1.2rem;
        }
        .history-item .history-text {
            color: #d4c5b5;
            margin-top: 4px;
            white-space: pre-wrap;
            font-size: 0.95rem;
        }
        .history-item .history-actions {
            margin-top: 10px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        /* ===== КОНТРОЛЫ ===== */
        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .control-group {
            background: rgba(30, 24, 20, 0.9);
            border-radius: 12px;
            padding: 15px;
            border: 1px solid #4a3a2e;
            backdrop-filter: blur(4px);
        }
        .control-group h3 {
            font-family: 'Russo One', sans-serif;
            color: #f5c842;
            margin-bottom: 10px;
            font-size: 1.1rem;
            border-bottom: 1px solid #4a3a2e;
            padding-bottom: 5px;
        }
        .control-group ul {
            list-style: none;
            max-height: 180px;
            overflow-y: auto;
            margin: 10px 0;
        }
        .control-group ul li {
            background: #2d221c;
            padding: 6px 10px;
            margin: 4px 0;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
            color: #d4c5b5;
        }
        .control-group ul li .item-text { flex: 1; margin-right: 8px; }
        .control-group .add-area {
            display: flex;
            gap: 6px;
            margin-top: 8px;
            flex-wrap: wrap;
        }
        .control-group input, .control-group textarea {
            flex: 1;
            padding: 8px;
            border: none;
            border-radius: 6px;
            background: #2d221c;
            color: #e0d6c8;
            outline: none;
            font-family: inherit;
            min-width: 100px;
            border: 1px solid #4a3a2e;
        }
        .control-group input:focus, .control-group textarea:focus {
            border-color: #f5c842;
        }
        .control-group textarea {
            min-height: 50px;
            resize: vertical;
            flex-basis: 100%;
        }
        .add-btn {
            background: #2e7d5e;
            border: none;
            color: #e0d6c8;
            font-weight: bold;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
            border: 1px solid #2e7d5e;
        }
        .add-btn:hover {
            background: #3a9a72;
            box-shadow: 0 0 15px #2ecc7155;
        }

        /* Секреты */
        .secret-control-group .secret-item {
            display: flex;
            flex-direction: column;
            background: #2d221c;
            padding: 8px 10px;
            margin: 6px 0;
            border-radius: 6px;
        }
        .secret-item .secret-title { font-weight: bold; color: #a29bfe; }
        .secret-item .secret-desc { font-size: 0.85rem; color: #b8a088; margin: 2px 0; }
        .secret-item .secret-effect { font-size: 0.85rem; color: #f5c842; }
        .secret-item .secret-actions { display: flex; justify-content: flex-end; margin-top: 4px; }

        /* Адаптация */
        @media (max-width: 600px) {
            .container { padding: 10px; }
            h1 { font-size: 2rem; }
            .panel { flex-direction: column; align-items: stretch; }
            .panel input[type="number"] { width: 100%; }
            .cards-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
            .card-item .value { font-size: 1.1rem; }
        }

        /* Печать */
        @media print {
            body { background: #fff !important; padding: 0.3in !important; }
            .main-interface .panel, .controls, .history-section, .btn, .footer { display: none !important; }
            .cards-grid { display: grid !important; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)) !important; }
            .card-item {
                border: 1px solid #333 !important;
                box-shadow: none !important;
                background: #f2e6d9 !important;
                color: #000 !important;
                page-break-inside: avoid;
                break-inside: avoid;
                animation: none !important;
                opacity: 1 !important;
                transform: none !important;
            }
            .card-item .value { color: #000 !important; }
            .card-item .value.health { color: #b33a2a !important; }
            .card-item .value.age { color: #2a6a8a !important; }
            .card-item .value.experience { color: #8a7a2a !important; }
            .card-item .value.job { color: #8a6a1a !important; }
            .card-item .value.hobby { color: #5a3a7a !important; }
            .card-item .value.items { color: #1a7a5a !important; }
            .card-item .value.fact { color: #6a2a7a !important; }
            .card-item .value.orientation { color: #8a5a1a !important; }
            .card-item .value.skill { color: #b33a2a !important; }
            .card-item .value.education { color: #1a7a8a !important; }
            .card-item .value.phobia { color: #6a2a5a !important; }
            .card-item .value.gender.male { color: #2a5a8a !important; }
            .card-item .value.gender.female { color: #b33a6a !important; }
        }

        .footer {
            text-align: center;
            margin-top: 40px;
            color: #6a5a4a;
            font-size: 0.9rem;
            border-top: 1px solid #3d2e24;
            padding-top: 20px;
        }
    </style>
</head>
<body>

    <!-- ===== ЗАСТАВКА ===== -->
    <div id="splashScreen">
        <div class="splash-bg" id="splashBg" style="background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600"><rect width="800" height="600" fill="%231a1410"/><path d="M0 0 L800 0 L800 600 L0 600 Z" stroke="%235a4638" stroke-width="4" fill="none"/><circle cx="400" cy="300" r="200" stroke="%234d3c30" stroke-width="2" fill="none"/><circle cx="400" cy="300" r="100" stroke="%234d3c30" stroke-width="1" fill="none"/><line x1="200" y1="100" x2="600" y2="500" stroke="%233d2e24" stroke-width="2"/><line x1="600" y1="100" x2="200" y2="500" stroke="%233d2e24" stroke-width="2"/></svg>');"></div>
        <div class="splash-content">
            <div class="splash-title">БУНКЕР</div>
            <div class="splash-sub">Колода карт • История • Выживание</div>
            <button class="btn-start" id="enterBtn">Начать играть</button>
        </div>
    </div>

    <!-- ===== ОСНОВНОЙ ИНТЕРФЕЙС ===== -->
    <div class="container main-interface" id="mainInterface">
        <h1>🃏 КОЛОДА КАРТ «БУНКЕР»</h1>

        <!-- Панель управления -->
        <div class="panel">
            <label for="cardCountInput">Количество карт:</label>
            <input type="number" id="cardCountInput" value="6" min="1" max="20">
            <button class="btn btn-success" id="generateDeckBtn">🃏 Сгенерировать колоду</button>
            <button class="btn btn-print" id="printDeckBtn">🖨️ Распечатать колоду</button>
            <button class="btn btn-secret-print" id="printSecretsBtn">🔮 Распечатать секреты</button>
            <button class="btn btn-secondary" id="resetBtn">♻️ Сбросить списки</button>
            <button class="btn btn-secondary" id="bgUploadBtn" style="margin-left:auto;">📁 Загрузить фон</button>

                        }
                        return parsed;

            function getRandom(arr) {
                return arr[Math.floor(Math.random() * arr.length)];
            }

            function shuffleArray(arr) {
                for (let i = arr.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [arr[i], arr[j]] = [arr[j], arr[i]];
                }
                return arr;
            }

            function getUniqueRandomValues(arr, n) {
                const shuffled = shuffleArray([...arr]);
                if (shuffled.length >= n) {
                    return shuffled.slice(0, n);
                } else {
                    const result = [...shuffled];
                    while (result.length < n) {
                        result.push(getRandom(arr));
                    }
                    return result;
                }
            }

                </head>
                <body>
                    <h1>📜 ${title}</h1>
                    <div class="history-text">${text}</div>
                    <script>
                        window.onload = function() { window.print(); }
                    <\/script>
                </body>
                </html>
                `;
                const win = window.open('', '_blank');
                if (win) {
                    win.document.write(html);
                    win.document.close();
                } else {
                    alert('Разрешите всплывающие окна для печати.');
                }
            }

            // ===== ОЗВУЧКА (Web Speech) =====
            function speakText(text) {
                if (!window.speechSynthesis) {
                    alert('Ваш браузер не поддерживает озвучку.');
                    return;
                }
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'ru-RU';
                utterance.rate = 0.9;
                utterance.pitch = 1;
                window.speechSynthesis.speak(utterance);
            }

            // ===== ОТРИСОВКА УПРАВЛЕНИЯ =====
            function renderControls() {
                const container = document.getElementById('controlsContainer');
                container.innerHTML = '';

                const categories = [
                    { key: 'gender', label: 'Пол', placeholder: 'Напр. Мужской' },
                    { key: 'health', label: 'Здоровье', placeholder: 'Напр. Отличное' },
                    { key: 'age', label: 'Возраст', placeholder: 'Напр. 22' },
                    { key: 'experience', label: 'Стаж работы', placeholder: 'Напр. 5 лет' },
                    { key: 'jobs', label: 'Работа', placeholder: 'Напр. Плотник' },
                    { key: 'hobbies', label: 'Хобби', placeholder: 'Напр. Плавание' },
                    { key: 'items', label: 'Предметы', placeholder: 'Напр. Палатка' },
                    { key: 'facts', label: 'Интересные факты', placeholder: 'Напр. умеет жонглировать' },
                    { key: 'orientations', label: 'Ориентации', placeholder: 'Напр. Бисексуал' },
                    { key: 'skills', label: 'Специальные навыки', placeholder: 'Напр. умеет дышать под водой' },
                    { key: 'education', label: 'Образование', placeholder: 'Напр. Инженер-электроник' },
                    { key: 'phobias', label: 'Фобии', placeholder: 'Напр. Арахнофобия' }
                ];

                categories.forEach(cat => {
                    const group = document.createElement('div');
                    group.className = 'control-group';

                    const title = document.createElement('h3');
                    title.textContent = cat.label;
                    group.appendChild(title);

                    const list = document.createElement('ul');
                    list.id = `list-${cat.key}`;

                    const items = data[cat.key];
                    items.forEach((value, index) => {
                        const li = document.createElement('li');
                        const span = document.createElement('span');
                        span.className = 'item-text';
                        span.textContent = value;
                        li.appendChild(span);
                        // Кнопка озвучки
                        const speakBtn = document.createElement('button');
                        speakBtn.className = 'btn btn-secondary btn-sm';
                        speakBtn.textContent = '🔊';
                        speakBtn.title = 'Озвучить';
                        speakBtn.style.marginRight = '6px';
                        speakBtn.addEventListener('click', (e) => {
                            e.stopPropagation();
                            speakText(value);
                        });
                        li.appendChild(speakBtn);
                        // Кнопка удаления
                        const delBtn = document.createElement('button');
                        delBtn.className = 'btn btn-danger btn-sm';
                        delBtn.textContent = '✕';
                        delBtn.addEventListener('click', () => {
                            data[cat.key].splice(index, 1);
                            saveData();
                            renderControls();
                        });
                        li.appendChild(delBtn);
                        list.appendChild(li);
                    });

                    group.appendChild(list);

                    const addArea = document.createElement('div');
                    addArea.className = 'add-area';
                    const input = document.createElement('input');
                    input.type = 'text';
                    input.placeholder = cat.placeholder;
                    input.id = `input-${cat.key}`;
                    const addBtn = document.createElement('button');
                    addBtn.className = 'add-btn';
                    addBtn.textContent = '+ Добавить';
                    addBtn.addEventListener('click', () => {
                        const val = input.value.trim();
                        if (val === '') return;
                        data[cat.key].push(val);
                        saveData();
                        renderControls();
                        input.value = '';
                    });
                    input.addEventListener('keypress', (e) => {
                        if (e.key === 'Enter') addBtn.click();
                    });

                    addArea.appendChild(input);
                    addArea.appendChild(addBtn);
                    group.appendChild(addArea);

                    container.appendChild(group);
                });

                renderSecretControls();
                renderHistories();
            }

            function renderSecretControls() {
                const container = document.getElementById('secretControlsContainer');
                container.innerHTML = '';

                const group = document.createElement('div');
                group.className = 'control-group secret-control-group';
                group.style.gridColumn = '1 / -1';

                const title = document.createElement('h3');
                title.textContent = 'Список секретных карточек';
                group.appendChild(title);

                const list = document.createElement('ul');
                data.secrets.forEach((secret, index) => {
                    const li = document.createElement('li');
                    li.className = 'secret-item';
                    const titleDiv = document.createElement('div');
                    titleDiv.className = 'secret-title';
                    titleDiv.textContent = secret.title || 'Без названия';
                    const descDiv = document.createElement('div');
                    descDiv.className = 'secret-desc';
                    descDiv.textContent = secret.description || '';
                    const effectDiv = document.createElement('div');
                    effectDiv.className = 'secret-effect';
                    effectDiv.textContent = 'Эффект: ' + (secret.effect || '—');
                    const actions = document.createElement('div');
                    actions.className = 'secret-actions';
                    // Кнопка озвучки
                    const speakBtn = document.createElement('button');
                    speakBtn.className = 'btn btn-secondary btn-sm';
                    speakBtn.textContent = '🔊';
                    speakBtn.title = 'Озвучить секрет';
                    speakBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        speakText(`${secret.title}. Эффект: ${secret.effect}. ${secret.description}`);
                    });
                    actions.appendChild(speakBtn);
                    const delBtn = document.createElement('button');
                    delBtn.className = 'btn btn-danger btn-sm';
                    delBtn.textContent = 'Удалить';
                    delBtn.addEventListener('click', () => {
                        data.secrets.splice(index, 1);
                        saveData();
                        renderSecretControls();
                    });
                    actions.appendChild(delBtn);
                    li.appendChild(titleDiv);
                    li.appendChild(descDiv);
                    li.appendChild(effectDiv);
                    li.appendChild(actions);
                    list.appendChild(li);
                });

                group.appendChild(list);

                const addArea = document.createElement('div');
                addArea.className = 'add-area';
                addArea.style.flexWrap = 'wrap';
                const inputTitle = document.createElement('input');
                inputTitle.type = 'text';
                inputTitle.placeholder = 'Название';
                inputTitle.style.flexBasis = '100%';
                const inputDesc = document.createElement('textarea');
                inputDesc.placeholder = 'Описание';
                inputDesc.style.flexBasis = '100%';
                const inputEffect = document.createElement('input');
                inputEffect.type = 'text';
                inputEffect.placeholder = 'Эффект (кратко)';
                inputEffect.style.flexBasis = '60%';
                const addBtn = document.createElement('button');
                addBtn.className = 'add-btn';
                addBtn.textContent = '+ Добавить секретную карточку';
                addBtn.addEventListener('click', () => {
                    const title = inputTitle.value.trim();
                    const desc = inputDesc.value.trim();
                    const effect = inputEffect.value.trim();
                    if (!title) { alert('Введите название'); return; }
                    data.secrets.push({ title, description: desc, effect: effect || '—' });
                    saveData();
                    renderSecretControls();
                    inputTitle.value = '';
                    inputDesc.value = '';
                    inputEffect.value = '';
                });

                addArea.appendChild(inputTitle);
                addArea.appendChild(inputDesc);
                addArea.appendChild(inputEffect);
                addArea.appendChild(addBtn);
                group.appendChild(addArea);

                container.appendChild(group);
            }

            // ===== ИСТОРИИ =====
            function renderHistories() {
                const container = document.getElementById('historyList');
                container.innerHTML = '';
                if (histories.length === 0) {
                    container.innerHTML = '<p style="color:#6a5a4a; padding:10px;">Нет сохранённых историй.</p>';
                    return;
                }
                histories.forEach((item, index) => {
                    const div = document.createElement('div');
                    div.className = 'history-item';
                    div.innerHTML = `
                        <div class="history-title">${item.title || 'Без названия'}</div>
                        <div class="history-text">${item.text || ''}</div>
                        <div class="history-actions">
                            <button class="btn btn-print btn-sm" data-index="${index}">🖨️ Печать</button>
                            <button class="btn btn-secondary btn-sm" data-index="${index}" data-action="speak">🔊 Озвучить</button>
                            <button class="btn btn-danger btn-sm" data-index="${index}" data-action="delete">🗑️ Удалить</button>
                        </div>
                    `;
                    container.appendChild(div);

                    // Печать
                    div.querySelector('[data-action="print"]')?.addEventListener('click', function() {
                        const idx = parseInt(this.dataset.index);
                        const item = histories[idx];
                        if (item) printHistoryItem(item.title, item.text);
                    });
                    // Озвучка
                    div.querySelector('[data-action="speak"]')?.addEventListener('click', function() {
                        const idx = parseInt(this.dataset.index);
                        const item = histories[idx];
                        if (item) speakText(item.title + '. ' + item.text);
                    });
                    // Удаление
                    div.querySelector('[data-action="delete"]')?.addEventListener('click', function() {
                        const idx = parseInt(this.dataset.index);
                        if (confirm('Удалить историю?')) {
                            histories.splice(idx, 1);
                            saveHistories(histories);
                            renderHistories();
                        }
                    });
                });
                // Назначаем обработчики (для совместимости, если data-action не сработает)
                container.querySelectorAll('.history-actions .btn-print').forEach(b => {
                    b.addEventListener('click', function() {
                        const idx = parseInt(this.dataset.index);
                        const item = histories[idx];
                        if (item) printHistoryItem(item.title, item.text);
                    });
                });
                container.querySelectorAll('.history-actions .btn-secondary').forEach(b => {
                    b.addEventListener('click', function() {
                        const idx = parseInt(this.dataset.index);
                        const item = histories[idx];
                        if (item) speakText(item.title + '. ' + item.text);
                    });
                });
                container.querySelectorAll('.history-actions .btn-danger').forEach(b => {
                    b.addEventListener('click', function() {
                        const idx = parseInt(this.dataset.index);
                        if (confirm('Удалить историю?')) {
                            histories.splice(idx, 1);
                            saveHistories(histories);
                            renderHistories();
                        }
                    });
                });
            }

            // ===== СОБЫТИЯ =====
            // Загрузка фона
            document.getElementById('bgUploadBtn').addEventListener('click', function() {
                document.getElementById('bgFileInput').click();
            });
            document.getElementById('bgFileInput').addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = function(ev) {
                    saveBg(ev.target.result);
                    alert('Фон загружен!');
                };
                reader.readAsDataURL(file);
                this.value = '';
            });

            // Кнопки
            document.getElementById('generateDeckBtn').addEventListener('click', function() {
                const count = parseInt(document.getElementById('cardCountInput').value) || 6;
                generateDeck(count);
            });

            document.getElementById('printDeckBtn').addEventListener('click', printDeck);
            document.getElementById('printSecretsBtn').addEventListener('click', printSecrets);

            document.getElementById('resetBtn').addEventListener('click', function() {
                if (confirm('Сбросить все списки к стандартным? Истории и фон останутся.')) {
                    localStorage.removeItem(STORAGE_KEY);
                    data = getDefault();
                    saveData();
                    renderControls();
                    generateDeck(parseInt(document.getElementById('cardCountInput').value) || 6);
                }
            });

            // Добавление истории
            document.getElementById('addHistoryBtn').addEventListener('click', function() {
                const title = document.getElementById('historyTitleInput').value.trim() || 'История ' + (histories.length + 1);
                const text = document.getElementById('historyTextInput').value.trim();
                if (!text) { alert('Введите текст истории'); return; }
                histories.push({ title, text });
                saveHistories(histories);
                document.getElementById('historyTitleInput').value = '';
                document.getElementById('historyTextInput').value = '';
                renderHistories();
            });

            // ===== ЗАСТАВКА =====
            document.getElementById('enterBtn').addEventListener('click', function() {
                document.getElementById('splashScreen').classList.add('hidden');
                document.getElementById('mainInterface').classList.add('active');
                // Инициализируем колоду
                generateDeck(parseInt(document.getElementById('cardCountInput').value) || 6);
                // Загружаем фон
                loadBg();
            });

            // ===== ЗАПУСК =====
            renderControls();
            // Если заставка не нужна (можно убрать), но по умолчанию показываем
            // При первом запуске колода будет сгенерирована после нажатия "Начать играть"
        })();
    </script>
</body>
</html>
