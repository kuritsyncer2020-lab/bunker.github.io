<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Бункер – многопользовательский</title>
    <style>
        /* ===== ОСНОВНЫЕ СТИЛИ ===== */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: #0d0d1a;
            color: #e0e0e0;
            padding: 20px;
            min-height: 100vh;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 {
            text-align: center;
            font-size: 2.5rem;
            color: #f5c842;
            margin-bottom: 10px;
            letter-spacing: 2px;
            text-shadow: 0 0 10px #f5c84255;
        }
        .history {
            background: #1a1a2e;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 30px;
            border-left: 6px solid #f5c842;
            line-height: 1.7;
            font-size: 1.05rem;
            max-height: 400px;
            overflow-y: auto;
            outline: none;
        }
        .history:focus {
            border-left-color: #ffd95e;
            box-shadow: 0 0 0 2px #f5c84255;
        }
        .history strong { color: #f5c842; }
        .history p { margin: 10px 0; }
        .history ul { margin-left: 20px; color: #ccc; }
        .history-edit-bar {
            display: flex;
            gap: 10px;
            margin: -15px 0 20px 0;
            flex-wrap: wrap;
        }
        .history-edit-bar button {
            background: #2d2d4a;
            border: none;
            color: #e0e0e0;
            padding: 6px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: 0.2s;
        }
        .history-edit-bar button:hover { background: #3d3d5e; }
        .history-edit-bar .save-history {
            background: #f5c842;
            color: #1a1a2e;
        }
        .history-edit-bar .save-history:hover { background: #ffd95e; }
        .history-edit-bar .print-history {
            background: #74b9ff;
            color: #1a1a2e;
        }
        .history-edit-bar .print-history:hover { background: #8fcbff; }
        .history-edit-bar .print-history-photo {
            background: #a29bfe;
            color: #1a1a2e;
        }
        .history-edit-bar .print-history-photo:hover { background: #b8b0ff; }

        .btn-primary, .btn-secondary, .btn-print, .btn-success, .btn-secret-print {
            border: none;
            font-weight: bold;
            padding: 14px 28px;
            border-radius: 50px;
            cursor: pointer;
            transition: 0.2s;
            font-size: 1.1rem;
            display: inline-block;
            margin: 5px 8px 20px 0;
        }
        .btn-primary {
            background: #f5c842;
            color: #1a1a2e;
            box-shadow: 0 4px 15px #f5c84255;
        }
        .btn-primary:hover { background: #ffd95e; transform: scale(1.02); }
        .btn-success {
            background: #2ecc71;
            color: #1a1a2e;
            box-shadow: 0 4px 15px #2ecc7155;
        }
        .btn-success:hover { background: #27ae60; transform: scale(1.02); }
        .btn-secondary {
            background: #2d2d4a;
            color: #e0e0e0;
            box-shadow: 0 4px 15px #00000055;
        }
        .btn-secondary:hover { background: #3d3d5e; }
        .btn-print {
            background: #74b9ff;
            color: #1a1a2e;
            box-shadow: 0 4px 15px #74b9ff55;
        }
        .btn-print:hover { background: #8fcbff; transform: scale(1.02); }
        .btn-secret-print {
            background: #a29bfe;
            color: #1a1a2e;
            box-shadow: 0 4px 15px #a29bfe55;
        }
        .btn-secret-print:hover { background: #b8b0ff; transform: scale(1.02); }
        .btn-danger {
            background: #e74c3c;
            color: #fff;
            border: none;
            padding: 2px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
        }
        .btn-danger:hover { background: #c0392b; }
        .btn-reroll {
            background: #2d2d4a;
            border: none;
            color: #f5c842;
            padding: 2px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: 0.2s;
            margin-left: 8px;
        }
        .btn-reroll:hover {
            background: #3d3d5e;
            transform: scale(1.1);
        }
        .btn-sm {
            padding: 4px 10px;
            font-size: 0.8rem;
        }

        /* Панель создания игры */
        .create-panel {
            background: #1a1a2e;
            border-radius: 12px;
            padding: 15px 20px;
            margin: 10px 0 20px 0;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 15px;
            border: 1px solid #2a2a44;
        }
        .create-panel label {
            color: #aaa;
            font-weight: 600;
        }
        .create-panel input[type="number"] {
            width: 80px;
            padding: 10px 12px;
            border: none;
            border-radius: 8px;
            background: #2d2d4a;
            color: #fff;
            font-size: 1.1rem;
            text-align: center;
            outline: none;
        }
        .create-panel input[type="number"]:focus {
            box-shadow: 0 0 0 2px #f5c84255;
        }
        .create-panel .btn-success {
            margin: 0;
            padding: 10px 24px;
        }

        /* Сетка игроков */
        .players-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 25px;
            margin: 30px 0;
        }
        .player-card {
            background: #1e1e32;
            border-radius: 16px;
            padding: 20px;
            border: 1px solid #2a2a44;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            position: relative;
            transition: 0.3s;
        }
        .player-card .remove-player {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #e74c3c;
            border: none;
            color: #fff;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
        }
        .player-card .remove-player:hover { background: #c0392b; transform: scale(1.1); }
        .player-card .header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
            border-bottom: 1px solid #2a2a44;
            padding-bottom: 8px;
        }
        .player-card .avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #f5c842;
            background: #2a2a44;
            flex-shrink: 0;
        }
        .player-card .name-area {
            display: flex;
            align-items: center;
            gap: 6px;
            flex: 1;
        }
        .player-card .name-area .name-text {
            font-size: 1.2rem;
            font-weight: 600;
            color: #fff;
            background: transparent;
            border: none;
            padding: 0 4px;
            min-width: 100px;
            pointer-events: none;
        }
        .player-card .info-line {
            margin: 6px 0;
            font-size: 1rem;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
        }
        .player-card .label {
            font-weight: 600;
            color: #aaa;
            width: 120px;
            flex-shrink: 0;
        }
        .player-card .value {
            color: #fff;
            font-weight: 500;
        }
        .player-card .value.health { color: #ff6b6b; }
        .player-card .value.age { color: #74b9ff; }
        .player-card .value.job { color: #fdcb6e; }
        .player-card .value.hobby { color: #a29bfe; }
        .player-card .value.items { color: #55efc4; }
        .player-card .value.fact { color: #f8a5c2; font-style: italic; }
        .player-card .value.orientation { color: #fdcb6e; }
        .player-card .value.skill { color: #fd79a8; font-style: italic; }
        .player-card .value.experience { color: #ffeaa7; }
        .player-card .value.education { color: #81ecec; }
        .player-card .value.phobia { color: #dda0dd; font-style: italic; } /* новый цвет для фобий */
        .player-card .value.gender.male { color: #74b9ff; }
        .player-card .value.gender.female { color: #fd79a8; }
        .player-card .print-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 12px;
            border-top: 1px solid #2a2a44;
            padding-top: 12px;
        }
        .player-card .print-buttons button {
            background: #2d2d4a;
            border: none;
            color: #e0e0e0;
            padding: 4px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.75rem;
            transition: 0.2s;
        }
        .player-card .print-buttons button:hover { background: #3d3d5e; }

        /* Фотографии бункера */
        .bunker-photos {
            margin: 20px 0;
        }
        .bunker-photos .photo-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin: 10px 0;
            max-height: 250px;
            overflow-y: auto;
        }
        .bunker-photos .photo-grid .photo-item {
            position: relative;
            width: 100px;
            height: 100px;
            border-radius: 8px;
            overflow: hidden;
            border: 2px solid #f5c842;
            flex-shrink: 0;
        }
        .bunker-photos .photo-grid .photo-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .bunker-photos .photo-grid .photo-item .del-photo {
            position: absolute;
            top: -6px;
            right: -6px;
            background: #e74c3c;
            border: none;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            font-size: 12px;
            line-height: 20px;
            text-align: center;
            color: #fff;
            cursor: pointer;
            padding: 0;
        }
        .bunker-photos .photo-grid .photo-item .del-photo:hover { background: #c0392b; }
        .bunker-photos .photo-upload-area {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
            margin-top: 8px;
        }
        .bunker-photos .photo-upload-area input[type="file"] { display: none; }
        .bunker-photos .photo-upload-area label {
            background: #3498db;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            color: #fff;
            font-weight: bold;
            transition: 0.2s;
        }
        .bunker-photos .photo-upload-area label:hover { background: #2980b9; }
        .bunker-photos .photo-upload-area .file-count {
            color: #aaa;
            font-size: 0.9rem;
        }
        .format-hint {
            font-size: 0.85rem;
            color: #888;
            margin-top: 4px;
        }

        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .control-group {
            background: #1a1a2e;
            border-radius: 12px;
            padding: 15px;
            border: 1px solid #2a2a44;
        }
        .control-group h3 {
            color: #f5c842;
            margin-bottom: 10px;
            font-size: 1.1rem;
            border-bottom: 1px solid #2a2a44;
            padding-bottom: 5px;
        }
        .control-group ul {
            list-style: none;
            max-height: 180px;
            overflow-y: auto;
            margin: 10px 0;
        }
        .control-group ul li {
            background: #252540;
            padding: 6px 10px;
            margin: 4px 0;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
        }
        .control-group ul li .item-text {
            flex: 1;
            margin-right: 8px;
        }
        .control-group .add-area {
            display: flex;
            gap: 6px;
            margin-top: 8px;
            flex-wrap: wrap;
        }
        .control-group input, .control-group textarea {
            flex: 1;
            padding: 8px;
            border: none;
            border-radius: 6px;
            background: #2d2d4a;
            color: #fff;
            outline: none;
            font-family: inherit;
            min-width: 100px;
        }
        .control-group input::placeholder,
        .control-group textarea::placeholder { color: #888; }
        .control-group textarea {
            min-height: 50px;
            resize: vertical;
            flex-basis: 100%;
        }
        .control-group .add-btn {
            background: #2ecc71;
            border: none;
            color: #1a1a2e;
            font-weight: bold;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
        }
        .control-group .add-btn:hover { background: #27ae60; }
        .secret-control-group .secret-item {
            display: flex;
            flex-direction: column;
            background: #252540;
            padding: 8px 10px;
            margin: 6px 0;
            border-radius: 6px;
        }
        .secret-item .secret-title {
            font-weight: bold;
            color: #a29bfe;
        }
        .secret-item .secret-desc {
            font-size: 0.85rem;
            color: #aaa;
            margin: 2px 0;
        }
        .secret-item .secret-effect {
            font-size: 0.85rem;
            color: #f5c842;
        }
        .secret-item .secret-actions {
            display: flex;
            justify-content: flex-end;
            margin-top: 4px;
        }

        /* Фото-аватарки */
        .photo-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 10px 0;
            max-height: 200px;
            overflow-y: auto;
        }
        .photo-grid .photo-item {
            position: relative;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid #f5c842;
            flex-shrink: 0;
        }
        .photo-grid .photo-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .photo-grid .photo-item .del-photo {
            position: absolute;
            top: -6px;
            right: -6px;
            background: #e74c3c;
            border: none;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            font-size: 12px;
            line-height: 20px;
            text-align: center;
            color: #fff;
            cursor: pointer;
            padding: 0;
        }
        .photo-grid .photo-item .del-photo:hover { background: #c0392b; }
        .photo-upload-area {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
            margin-top: 8px;
        }
        .photo-upload-area input[type="file"] { display: none; }
        .photo-upload-area label {
            background: #3498db;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            color: #fff;
            font-weight: bold;
            transition: 0.2s;
        }
        .photo-upload-area label:hover { background: #2980b9; }
        .photo-upload-area .file-count {
            color: #aaa;
            font-size: 0.9rem;
        }

        @media print {
            body { background: #fff !important; padding: 0.5in !important; }
            .container { max-width: 100% !important; }
            .history, .controls, .btn-primary, .btn-secondary, .btn-print, .btn-success,
            .btn-secret-print, .history-edit-bar, .bunker-photos, .create-panel,
            #photoControlsContainer, #secretControlsContainer, #controlsContainer,
            .btn-reroll, .remove-player, .print-buttons, .footer {
                display: none !important;
            }
            .players-grid { display: block !important; }
            .player-card {
                box-shadow: none !important;
                border: 1px solid #333 !important;
                background: #fff !important;
                color: #000 !important;
                margin-bottom: 20px !important;
                page-break-inside: avoid;
                break-inside: avoid;
            }
            .player-card .header { border-bottom-color: #ccc !important; }
            .player-card .name-area .name-text { color: #000 !important; border-bottom-color: #aaa !important; }
            .player-card .label { color: #555 !important; }
            .player-card .value { color: #000 !important; }
            .player-card .value.health { color: #c0392b !important; }
            .player-card .value.age { color: #2980b9 !important; }
            .player-card .value.job { color: #d4a017 !important; }
            .player-card .value.hobby { color: #6c5b7b !important; }
            .player-card .value.items { color: #16a085 !important; }
            .player-card .value.fact { color: #8e44ad !important; }
            .player-card .value.orientation { color: #d4a017 !important; }
            .player-card .value.skill { color: #c0392b !important; }
            .player-card .value.experience { color: #b7950b !important; }
            .player-card .value.education { color: #1abc9c !important; }
            .player-card .value.phobia { color: #8e44ad !important; }
            .player-card .value.gender.male { color: #2980b9 !important; }
            .player-card .value.gender.female { color: #c0392b !important; }
            .player-card .avatar { border-color: #333 !important; }
        }
        .footer {
            text-align: center;
            margin-top: 40px;
            color: #666;
            font-size: 0.9rem;
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #f5c84255; border-radius: 10px; }
        ::-webkit-scrollbar-track { background: #1a1a2e; }
        @media (max-width: 600px) {
            .player-card .info-line { flex-direction: column; align-items: flex-start; }
            .player-card .label { width: auto; margin-bottom: 2px; }
            .players-grid { grid-template-columns: 1fr; }
            .create-panel { flex-direction: column; align-items: stretch; }
            .create-panel input[type="number"] { width: 100%; }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>⛑️ БУНКЕР</h1>

    <!-- История (редактируемая) -->
    <div class="history" id="historyBlock" contenteditable="true"></div>
    <div class="history-edit-bar">
        <button class="save-history" id="saveHistoryBtn">💾 Сохранить историю</button>
        <button id="resetHistoryBtn">↩️ Восстановить историю по умолчанию</button>
        <button class="print-history" id="printHistoryBtn">🖨️ Печать истории</button>
        <button class="print-history-photo" id="printHistoryPhotoBtn">🖨️ Печать истории с фото бункера</button>
        <span style="color:#888; font-size:0.9rem; align-self:center;">(кликните по тексту, чтобы редактировать)</span>
    </div>

    <!-- Панель создания игры -->
    <div class="create-panel">
        <label for="playerCountInput">Количество игроков:</label>
        <input type="number" id="playerCountInput" value="6" min="2" max="12">
        <button class="btn-success" id="createGameBtn">👥 Создать игру</button>
        <button class="btn-primary" id="newGameBtn">🌀 Новая игра (1 игрок)</button>
        <button class="btn-print" id="printBtn">🖨️ Печать всех карточек</button>
        <button class="btn-secret-print" id="printSecretsBtn">🔮 Печать всех секретов</button>
        <button class="btn-secondary" id="resetBtn">♻️ Сбросить всё</button>
    </div>

    <!-- Сетка игроков -->
    <div id="playersContainer" class="players-grid"></div>

    <!-- Фотографии бункера -->
    <div class="bunker-photos">
        <h2 style="color: #f5c842; margin: 30px 0 10px; font-weight: 300;">🏚️ Фотографии бункера</h2>
        <div id="bunkerPhotosContainer"></div>
    </div>

    <!-- Управление списками -->
    <h2 style="color: #f5c842; margin: 30px 0 10px; font-weight: 300;">Редактировать списки параметров</h2>
    <div class="controls" id="controlsContainer"></div>

    <!-- Секретные карточки (не привязаны к игрокам) -->
    <h2 style="color: #a29bfe; margin: 30px 0 10px; font-weight: 300;">Секретные карточки (для ведущего)</h2>
    <div class="controls" id="secretControlsContainer"></div>

    <!-- Фотографии игроков (аватарки) -->
    <h2 style="color: #55efc4; margin: 30px 0 10px; font-weight: 300;">Фотографии игроков (аватарки)</h2>
    <div class="controls" id="photoControlsContainer"></div>

    <div class="footer">Все изменения сохраняются автоматически. При печати отображаются только карточки.</div>
</div>

<script>
    (function() {
        // ===== ДАННЫЕ =====
        const DEFAULT_DATA = {
            gender: ['Мужской', 'Женский'],
            health: ['Отличное', 'Среднее', 'Слабое', 'Хронические болезни', 'Крепкое', 'Ранен'],
            age: [20, 22, 25, 28, 30, 33, 35, 38, 40, 42, 45, 48, 50, 55, 60],
            jobs: ['Инженер', 'Врач', 'Учитель', 'Строитель', 'Повар', 'Водитель', 'Программист', 'Фермер', 'Военный', 'Пожарный', 'Медсестра'],
            hobbies: ['Чтение', 'Рыбалка', 'Охота', 'Гитара', 'Шахматы', 'Бег', 'Фотография', 'Рисование', 'Садоводство', 'Кулинария'],
            items: ['Аптечка', 'Фонарик', 'Нож', 'Верёвка', 'Консервы', 'Компас', 'Рация', 'Топор', 'Спички', 'Палатка'],
            facts: ['умеет долго стоять на одной ноге', 'за 5 минут съедает суп вилкой', 'жонглирует петардами', 'знаком через 30 рукопожатий с Клинтоном',
                    'может отличить 50 оттенков серого', 'никогда не проигрывает в камень-ножницы-бумага', 'умеет говорить голосом Дарта Вейдера',
                    'знает наизусть все серии "Друзей"', 'может завязать шнурки одной рукой', 'всегда знает, который час без часов'],

            skills: ['умеет дышать под водой, но с аквалангом', 'умеет читать книгу задом наперед, но ничего не понимает',

        const STORAGE_KEY = 'bunkerAdvancedData';

        // ===== ЗАГРУЗКА ДАННЫХ =====
        function getDefault() {

            };

        function loadData() {
            const stored = localStorage.getItem(STORAGE_KEY);
            if (stored) {
                try {
                    const parsed = JSON.parse(stored);
                    for (let key in DEFAULT_DATA) {
                        if (!parsed[key] || !Array.isArray(parsed[key])) {
                            parsed[key] = [...DEFAULT_DATA[key]];
                        }
                    }
                    if (!parsed.secrets || !Array.isArray(parsed.secrets) || parsed.secrets.length === 0) {

        function getRandom(arr) {
            return arr[Math.floor(Math.random() * arr.length)];
        }

        function shuffleArray(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function getAvatarUrl() {
            if (data.avatars && data.avatars.length > 0) {
                return getRandom(data.avatars);
            } else {
                const seed = 'player_' + Date.now() + Math.random();
                return `https://api.dicebear.com/7.x/avataaars/svg?seed=${encodeURIComponent(seed)}&backgroundColor=b6e3f4`;
            }
        }

        // Генерация строки стажа (от 1 месяца до 30 лет)
        function generateExperience() {
            const months = Math.floor(Math.random() * 360) + 1; // от 1 до 360 месяцев
            if (months < 12) {
                return months + ' ' + getMonthWord(months);
            } else {
                const years = Math.floor(months / 12);
                return years + ' ' + getYearWord(years);
            }
        }

        function getMonthWord(n) {
            if (n === 1) return 'месяц';
            if (n >= 2 && n <= 4) return 'месяца';
            return 'месяцев';
        }

        function getYearWord(n) {
            if (n === 1) return 'год';
            if (n >= 2 && n <= 4) return 'года';
            return 'лет';
        }

        // Генерация одного игрока (без имени и секрета)
        function generatePlayer(usedHealth, usedAge, usedJob, usedHobby, usedItem, usedFact, usedOrientation, usedSkill, usedEducation, usedPhobia, index) {

            let health = getRandom(data.health);
            while (usedHealth.includes(health)) {
                health = getRandom(data.health);

            let age = getRandom(data.age);

            }
            let job = getRandom(data.jobs);
            while (usedJob.includes(job)) {

            while (usedHobby.includes(hobby)) {
                hobby = getRandom(data.hobbies);
            }
            let item = getRandom(data.items);
            while (usedItem.includes(item)) {
                item = getRandom(data.items);
            }

            }

            const avatar = getAvatarUrl();
            const experience = generateExperience();

            return {
                id: Date.now() + Math.random() + '',

        // Генерация N игроков (без секретов)
        function generatePlayers(n) {
            const usedHealth = [], usedAge = [], usedJob = [], usedHobby = [], usedItem = [], usedFact = [], usedOrientation = [], usedSkill = [], usedEducation = [], usedPhobia = [];
            const newPlayers = [];
            for (let i = 0; i < n; i++) {
                const p = generatePlayer(usedHealth, usedAge, usedJob, usedHobby, usedItem, usedFact, usedOrientation, usedSkill, usedEducation, usedPhobia, i);
                usedHealth.push(p.health);
                usedAge.push(p.age);
                usedJob.push(p.job);
                usedHobby.push(p.hobby);
                usedItem.push(p.item);
                usedFact.push(p.fact);
                usedOrientation.push(p.orientation);
                usedSkill.push(p.skill);
                usedEducation.push(p.education);
                usedPhobia.push(p.phobia);
                newPlayers.push(p);
            }
            return newPlayers;

            <style>
                body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #fff; padding: 40px; max-width: 800px; margin: 0 auto; }
                h1 { color: #1a1a2e; border-bottom: 2px solid #a29bfe; }
                .secret-card {
                    border: 1px solid #6c5b7b;
                    border-radius: 12px;
                    padding: 16px;
                    margin: 16px 0;
                    background: #f9f9ff;
                }
                .secret-card .title { font-size: 1.4rem; font-weight: bold; color: #2d2d4a; }
                .secret-card .effect { color: #e67e22; }
                .secret-card .desc { color: #555; margin-top: 4px; }
                @media print { body { padding: 0.5in; } }
            </style>
            </head>
            <body>
                <h1>🔮 Список секретных карточек (для ведущего)</h1>
            `;

            data.secrets.forEach((secret, idx) => {
                html += `<div class="secret-card">`;
                html += `<div class="title">${idx+1}. ${secret.title}</div>`;
                html += `<div class="effect">🎯 Эффект: ${secret.effect}</div>`;
                html += `<div class="desc">📖 Описание: ${secret.description}</div>`;
                html += `</div>`;
            });

            html += `
                <script>
                    window.onload = function() { window.print(); }
                <\/script>
            </body>
            </html>
            `;

            const win = window.open('', '_blank');
            if (win) {
                win.document.write(html);
                win.document.close();
            } else {
                alert('Разрешите всплывающие окна для печати.');
            }
        }

        // ===== ПЕЧАТЬ ВСЕХ КАРТОЧЕК =====
        document.getElementById('printBtn').addEventListener('click', function() {
            window.print();
        });

        document.getElementById('printSecretsBtn').addEventListener('click', printAllSecrets);

        // ===== ИСТОРИЯ =====
        function loadHistory() {
            const stored = localStorage.getItem(HISTORY_KEY);
            if (stored) {
                return stored;
            } else {
                return DEFAULT_HISTORY;
            }
        }

        function saveHistory(html) {
            localStorage.setItem(HISTORY_KEY, html);
        }

        function renderHistory() {
            const block = document.getElementById('historyBlock');
            block.innerHTML = loadHistory();
        }

        // ===== ПЕЧАТЬ ИСТОРИИ =====
        function printHistory(withPhoto) {
            const historyHtml = document.getElementById('historyBlock').innerHTML;
            let photoHtml = '';
            if (withPhoto && data.bunkerPhotos && data.bunkerPhotos.length > 0) {
                const photo = getRandom(data.bunkerPhotos);
                photoHtml = `<div style="margin: 20px 0; text-align:center;">
                    <img src="${photo}" alt="Фото бункера" style="max-width:100%; max-height:400px; border-radius:12px; border:2px solid #f5c842;">
                </div>`;
            } else if (withPhoto) {
                photoHtml = '<p style="color:#999;">(Нет загруженных фотографий бункера)</p>';
            }

            const win = window.open('', '_blank');
            if (win) {
                win.document.write(`
                    <!DOCTYPE html>
                    <html><head><meta charset="UTF-8"><title>История катастрофы</title>
                    <style>
                        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #fff; padding: 40px; max-width: 800px; margin: 0 auto; line-height: 1.7; }
                        h1 { color: #1a1a2e; border-bottom: 2px solid #f5c842; }
                        .history-content { font-size: 1.05rem; }
                        .history-content strong { color: #1a1a2e; }
                        .history-content ul { margin-left: 20px; }
                        .photo-container { margin: 20px 0; text-align:center; }
                        .photo-container img { max-width:100%; max-height:400px; border-radius:12px; border:2px solid #f5c842; }
                        @media print { body { padding: 0.5in; } }
                    </style>
                    </head>
                    <body>
                        <h1>📜 История катастрофы</h1>
                        <div class="history-content">${historyHtml}</div>
                        ${photoHtml}
                        <script>
                            window.onload = function() { window.print(); }
                        <\/script>
                    </body>
                    </html>
                `);
                win.document.close();
            } else {
                alert('Разрешите всплывающие окна для печати.');
            }
        }

        // ===== УПРАВЛЕНИЕ ИГРОКАМИ =====
        document.getElementById('newGameBtn').addEventListener('click', function() {
            const p = generatePlayer([], [], [], [], [], [], [], [], [], [], 0);
            players = [p];
            savePlayers(players);
            renderPlayers();
        });

        document.getElementById('createGameBtn').addEventListener('click', function() {
            const input = document.getElementById('playerCountInput');
            let count = parseInt(input.value);
            if (isNaN(count) || count < 2) count = 2;
            if (count > 12) count = 12;
            input.value = count;
            const minUnique = Math.min(data.health.length, data.jobs.length, data.hobbies.length, data.items.length, data.facts.length, data.orientations.length, data.skills.length, data.education.length, data.phobias.length);
            if (minUnique < count) {
                alert(`Внимание: для полной уникальности не хватает значений. Максимально возможное уникальных комбинаций: ${minUnique}. Но мы сгенерируем игроков с минимальными повторами.`);
            }
            players = generatePlayers(count);
            savePlayers(players);
            renderPlayers();
        });

        // ===== ОТРИСОВКА УПРАВЛЕНИЯ (списки) =====
        function renderControls() {
            const container = document.getElementById('controlsContainer');
            container.innerHTML = '';

            const categories = [
                { key: 'gender', label: 'Пол', placeholder: 'Напр. Мужской' },
                { key: 'health', label: 'Здоровье', placeholder: 'Напр. Отличное' },
                { key: 'age', label: 'Возраст', placeholder: 'Напр. 22' },
                { key: 'jobs', label: 'Работа', placeholder: 'Напр. Плотник' },
                { key: 'hobbies', label: 'Хобби', placeholder: 'Напр. Плавание' },
                { key: 'items', label: 'Предметы', placeholder: 'Напр. Палатка' },
                { key: 'facts', label: 'Интересные факты', placeholder: 'Напр. умеет жонглировать' },
                { key: 'orientations', label: 'Ориентации', placeholder: 'Напр. Бисексуал' },
                { key: 'skills', label: 'Специальные навыки', placeholder: 'Напр. умеет дышать под водой' },
                { key: 'education', label: 'Образование', placeholder: 'Напр. Инженер-электроник' },
                { key: 'phobias', label: 'Фобии', placeholder: 'Напр. Арахнофобия' }
            ];

            categories.forEach(cat => {
                const group = document.createElement('div');
                group.className = 'control-group';

                const title = document.createElement('h3');
                title.textContent = cat.label;
                group.appendChild(title);

                const list = document.createElement('ul');
                list.id = `list-${cat.key}`;

                const items = data[cat.key];
                items.forEach((value, index) => {
                    const li = document.createElement('li');
                    const span = document.createElement('span');
                    span.className = 'item-text';
                    span.textContent = value;
                    li.appendChild(span);
                    const delBtn = document.createElement('button');
                    delBtn.className = 'btn-danger';
                    delBtn.textContent = '✕';
                    delBtn.addEventListener('click', () => {
                        data[cat.key].splice(index, 1);
                        saveData();
                        renderControls();
                    });
                    li.appendChild(delBtn);
                    list.appendChild(li);
                });

                group.appendChild(list);

                const addArea = document.createElement('div');
                addArea.className = 'add-area';
                const input = document.createElement('input');
                input.type = 'text';
                input.placeholder = cat.placeholder;
                input.id = `input-${cat.key}`;
                const addBtn = document.createElement('button');
                addBtn.className = 'add-btn';
                addBtn.textContent = '+ Добавить';
                addBtn.addEventListener('click', () => {
                    const val = input.value.trim();
                    if (val === '') return;
                    data[cat.key].push(val);
                    saveData();
                    renderControls();
                    input.value = '';
                });
                input.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') addBtn.click();
                });

                addArea.appendChild(input);
                addArea.appendChild(addBtn);
                group.appendChild(addArea);

                container.appendChild(group);
            });

            renderSecretControls();
            renderPhotoControls();
            renderBunkerPhotos();
        }

        function renderSecretControls() {
            const container = document.getElementById('secretControlsContainer');
            container.innerHTML = '';

            const group = document.createElement('div');
            group.className = 'control-group secret-control-group';
            group.style.gridColumn = '1 / -1';

            const title = document.createElement('h3');
            title.textContent = 'Список секретных карточек (для ведущего)';
            group.appendChild(title);

            const list = document.createElement('ul');
            data.secrets.forEach((secret, index) => {
                const li = document.createElement('li');
                li.className = 'secret-item';
                const titleDiv = document.createElement('div');
                titleDiv.className = 'secret-title';
                titleDiv.textContent = secret.title || 'Без названия';
                const descDiv = document.createElement('div');
                descDiv.className = 'secret-desc';
                descDiv.textContent = secret.description || '';
                const effectDiv = document.createElement('div');
                effectDiv.className = 'secret-effect';
                effectDiv.textContent = 'Эффект: ' + (secret.effect || '—');
                const actions = document.createElement('div');
                actions.className = 'secret-actions';
                const delBtn = document.createElement('button');
                delBtn.className = 'btn-danger';
                delBtn.textContent = 'Удалить';
                delBtn.addEventListener('click', () => {
                    data.secrets.splice(index, 1);
                    saveData();
                    renderSecretControls();
                });
                actions.appendChild(delBtn);
                li.appendChild(titleDiv);
                li.appendChild(descDiv);
                li.appendChild(effectDiv);
                li.appendChild(actions);
                list.appendChild(li);
            });

            group.appendChild(list);

            const addArea = document.createElement('div');
            addArea.className = 'add-area';
            addArea.style.flexWrap = 'wrap';
            const inputTitle = document.createElement('input');
            inputTitle.type = 'text';
            inputTitle.placeholder = 'Название';
            inputTitle.style.flexBasis = '100%';
            const inputDesc = document.createElement('textarea');
            inputDesc.placeholder = 'Описание';
            inputDesc.style.flexBasis = '100%';
            const inputEffect = document.createElement('input');
            inputEffect.type = 'text';
            inputEffect.placeholder = 'Эффект (кратко)';
            inputEffect.style.flexBasis = '60%';
            const addBtn = document.createElement('button');
            addBtn.className = 'add-btn';
            addBtn.textContent = '+ Добавить секретную карточку';
            addBtn.addEventListener('click', () => {
                const title = inputTitle.value.trim();
                const desc = inputDesc.value.trim();
                const effect = inputEffect.value.trim();
                if (!title) { alert('Введите название'); return; }
                data.secrets.push({ title, description: desc, effect: effect || '—' });
                saveData();
                renderSecretControls();
                inputTitle.value = '';
                inputDesc.value = '';
                inputEffect.value = '';
            });

            addArea.appendChild(inputTitle);
            addArea.appendChild(inputDesc);
            addArea.appendChild(inputEffect);
            addArea.appendChild(addBtn);
            group.appendChild(addArea);

            container.appendChild(group);
        }

        function renderPhotoControls() {
            const container = document.getElementById('photoControlsContainer');
            container.innerHTML = '';

            const group = document.createElement('div');
            group.className = 'control-group';
            group.style.gridColumn = '1 / -1';

            const title = document.createElement('h3');
            title.textContent = 'Загруженные аватарки игроков';
            group.appendChild(title);

            const photoGrid = document.createElement('div');
            photoGrid.className = 'photo-grid';
            if (data.avatars && data.avatars.length > 0) {
                data.avatars.forEach((base64, index) => {
                    const div = document.createElement('div');
                    div.className = 'photo-item';
                    const img = document.createElement('img');
                    img.src = base64;
                    img.alt = 'avatar';
                    const del = document.createElement('button');
                    del.className = 'del-photo';
                    del.textContent = '✕';
                    del.addEventListener('click', () => {
                        data.avatars.splice(index, 1);
                        saveData();
                        renderPhotoControls();
                        players.forEach(p => {
                            if (p.avatar === base64) {
                                p.avatar = getAvatarUrl();
                            }
                        });
                        savePlayers(players);
                        renderPlayers();
                    });
                    div.appendChild(img);
                    div.appendChild(del);
                    photoGrid.appendChild(div);
                });
            } else {
                const empty = document.createElement('p');
                empty.textContent = 'Нет загруженных фото. Загрузите свои изображения.';
                empty.style.color = '#888';
                empty.style.padding = '10px 0';
                photoGrid.appendChild(empty);
            }
            group.appendChild(photoGrid);

            const uploadArea = document.createElement('div');
            uploadArea.className = 'photo-upload-area';

            const fileInput = document.createElement('input');
            fileInput.type = 'file';
            fileInput.id = 'avatarUpload';
            fileInput.accept = 'image/*';
            fileInput.multiple = true;

            const label = document.createElement('label');
            label.htmlFor = 'avatarUpload';
            label.textContent = '📁 Выбрать фото';

            const countSpan = document.createElement('span');
            countSpan.className = 'file-count';
            countSpan.textContent = `(загружено: ${data.avatars.length})`;

            const hint = document.createElement('div');
            hint.className = 'format-hint';
            hint.textContent = 'Поддерживаются любые форматы (PNG, JPG, GIF, WebP). Максимальный размер – до 5 МБ на файл.';

            fileInput.addEventListener('change', function(e) {
                const files = e.target.files;
                if (files.length === 0) return;
                Array.from(files).forEach(file => {
                    if (file.size > 5 * 1024 * 1024) {
                        alert(`Файл ${file.name} слишком большой (>5 МБ). Пожалуйста, сожмите изображение.`);
                        return;
                    }
                    const reader = new FileReader();
                    reader.onload = function(ev) {
                        const base64 = ev.target.result;
                        data.avatars.push(base64);
                        saveData();
                        renderPhotoControls();
                        const span = document.querySelector('.file-count');
                        if (span) span.textContent = `(загружено: ${data.avatars.length})`;
                    };
                    reader.readAsDataURL(file);
                });
                fileInput.value = '';
            });

            uploadArea.appendChild(fileInput);
            uploadArea.appendChild(label);
            uploadArea.appendChild(countSpan);
            uploadArea.appendChild(hint);
            group.appendChild(uploadArea);

            container.appendChild(group);
        }

        function renderBunkerPhotos() {
            const container = document.getElementById('bunkerPhotosContainer');
            container.innerHTML = '';

            const group = document.createElement('div');
            group.className = 'control-group';
            group.style.gridColumn = '1 / -1';

            const title = document.createElement('h3');
            title.textContent = 'Фотографии бункера (для оформления)';
            group.appendChild(title);

            const photoGrid = document.createElement('div');
            photoGrid.className = 'photo-grid';
            if (data.bunkerPhotos && data.bunkerPhotos.length > 0) {
                data.bunkerPhotos.forEach((base64, index) => {
                    const div = document.createElement('div');
                    div.className = 'photo-item';
                    const img = document.createElement('img');
                    img.src = base64;
                    img.alt = 'bunker photo';
                    const del = document.createElement('button');
                    del.className = 'del-photo';
                    del.textContent = '✕';
                    del.addEventListener('click', () => {
                        data.bunkerPhotos.splice(index, 1);
                        saveData();
                        renderBunkerPhotos();
                    });
                    div.appendChild(img);
                    div.appendChild(del);
                    photoGrid.appendChild(div);
                });
            } else {
                const empty = document.createElement('p');
                empty.textContent = 'Нет фотографий бункера. Загрузите свои изображения.';
                empty.style.color = '#888';
                empty.style.padding = '10px 0';
                photoGrid.appendChild(empty);
            }
            group.appendChild(photoGrid);

            const uploadArea = document.createElement('div');
            uploadArea.className = 'photo-upload-area';

            const fileInput = document.createElement('input');
            fileInput.type = 'file';
            fileInput.id = 'bunkerPhotoUpload';
            fileInput.accept = 'image/*';
            fileInput.multiple = true;

            const label = document.createElement('label');
            label.htmlFor = 'bunkerPhotoUpload';
            label.textContent = '📁 Загрузить фото бункера';

            const countSpan = document.createElement('span');
            countSpan.className = 'file-count';
            countSpan.textContent = `(загружено: ${data.bunkerPhotos.length})`;

            const hint = document.createElement('div');
            hint.className = 'format-hint';
            hint.textContent = 'Поддерживаются любые форматы (PNG, JPG, GIF, WebP). Используйте для украшения истории или печати.';

            fileInput.addEventListener('change', function(e) {
                const files = e.target.files;
                if (files.length === 0) return;
                Array.from(files).forEach(file => {
                    if (file.size > 5 * 1024 * 1024) {
                        alert(`Файл ${file.name} слишком большой (>5 МБ).`);
                        return;
                    }
                    const reader = new FileReader();
                    reader.onload = function(ev) {
                        const base64 = ev.target.result;
                        data.bunkerPhotos.push(base64);
                        saveData();
                        renderBunkerPhotos();
                    };
                    reader.readAsDataURL(file);
                });
                fileInput.value = '';
            });

            uploadArea.appendChild(fileInput);
            uploadArea.appendChild(label);
            uploadArea.appendChild(countSpan);
            uploadArea.appendChild(hint);
            group.appendChild(uploadArea);

            container.appendChild(group);
        }

        // ===== СОБЫТИЯ ДЛЯ ИСТОРИИ =====
        document.getElementById('saveHistoryBtn').addEventListener('click', function() {
            const html = document.getElementById('historyBlock').innerHTML;
            saveHistory(html);
            alert('История сохранена!');
        });

        document.getElementById('resetHistoryBtn').addEventListener('click', function() {
            if (confirm('Восстановить историю по умолчанию?')) {
                localStorage.removeItem(HISTORY_KEY);
                renderHistory();
            }
        });

        document.getElementById('printHistoryBtn').addEventListener('click', function() {
            printHistory(false);
        });

        document.getElementById('printHistoryPhotoBtn').addEventListener('click', function() {
            printHistory(true);
        });

        // Сброс всего
        document.getElementById('resetBtn').addEventListener('click', function() {
            if (confirm('Сбросить все настройки и списки к стандартным? Все ваши изменения будут потеряны.')) {
                localStorage.removeItem(STORAGE_KEY);
                localStorage.removeItem(PLAYERS_KEY);
                localStorage.removeItem(HISTORY_KEY);
                data = getDefault();
                saveData();
                players = [];
                savePlayers(players);
                renderHistory();
                renderControls();
                renderPlayers();
            }
        });

        // ===== ЗАПУСК =====
        renderHistory();
        renderControls();
        if (players.length === 0) {
            const p = generatePlayer([], [], [], [], [], [], [], [], [], [], 0);
            players = [p];
            savePlayers(players);
        }
        renderPlayers();
    })();
</script>
</body>
</html>
